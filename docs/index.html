<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвентори Склад — Документы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .container {
            background: white;
            padding: 32px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #1A73E8;
            margin-bottom: 8px;
            font-size: 26px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .btn {
            display: block;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-terms {
            background: #1A73E8;
            color: white;
        }
        .btn-terms:hover {
            background: #1557b0;
        }
        .btn-privacy {
            background: #34A853;
            color: white;
        }
        .btn-privacy:hover {
            background: #2d8f47;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h1 { font-size: 22px; }
            .btn { font-size: 15px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Инвентори Склад</h1>
        <p>Юридические документы для пользователей</p>

        <a href="terms.html" class="btn btn-terms">📄 Пользовательское соглашение</a>
        <a href="privacy.html" class="btn btn-privacy">🔒 Политика конфиденциальности</a>

        <div class="footer">
            Связь с разработчиком: kayfull.in@yandex.ru
        </div>
    </div>
</body>
</html>
